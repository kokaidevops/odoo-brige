# nginx.conf
# ─────────────────────────────────────────────────────────
# Nginx configuration for Odoo Bridge
# Handles: SSL termination, WebSocket upgrade, CORS headers
# ─────────────────────────────────────────────────────────

upstream bridge {
    server bridge:3000;
    keepalive 64;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name your-bridge-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-bridge-domain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # Disable buffering — critical for Server-Sent Events streaming
    proxy_buffering off;

    # ── REST API Endpoints ───────────────────────────────
    location /api/ {
        proxy_pass         http://bridge;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout for SSE streaming endpoints
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Socket.io WebSocket Upgrade ──────────────────────
    location /socket.io/ {
        proxy_pass         http://bridge;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        keepalive_timeout   86400s;
    }
}
